<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲風抽籤機 · Victor Chang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f5f3;
    --surface: #ffffff;
    --line: #e7e7e4;
    --text: #17181a;
    --muted: #7a7a76;
    --signal: #ff8a5c;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
  }
  ::selection{ background: var(--signal); color: #fff; }
  a{ color: inherit; }

  .wrap{ max-width: 920px; margin: 0 auto; padding: 0 24px 80px; }

  header{ padding: 56px 0 32px; }
  .back{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-decoration: none;
  }
  .back:hover{ color: var(--signal); }
  h1{
    font-weight: 800;
    font-size: clamp(30px, 5.5vw, 44px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 18px 0 14px;
  }
  .lede{ color: var(--muted); font-size: 15px; margin: 0; max-width: 60ch; }
  .lede a{ color: var(--signal); text-decoration: none; }
  .lede a:hover{ text-decoration: underline; }

  .card{
    background: var(--surface);
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    border-top: 3px solid var(--accent, var(--signal));
    margin-top: 24px;
  }

  /* ---------- draw ---------- */
  .draw-btn{
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    padding: 14px 26px;
    background: var(--signal);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .draw-btn:hover{ opacity: 0.9; transform: translateY(-1px); }
  .draw-btn:disabled{ background: var(--line); color: var(--muted); cursor: default; transform: none; }

  .result{ margin-top: 24px; }
  .result[hidden]{ display: none; }
  .genre-name{
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--accent);
    margin: 0 0 6px;
    word-break: break-word;
  }
  .genre-meta{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .example{
    margin: 18px 0 20px;
    font-size: 15px;
    color: var(--muted);
  }
  .example b{ color: var(--text); font-weight: 600; }

  .actions{ display: flex; flex-wrap: wrap; gap: 10px; }
  .act{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .act:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .act.primary{ background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- list ---------- */
  .search{
    width: 100%;
    font-family: var(--sans);
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fafaf8;
    color: var(--text);
    outline: none;
  }
  .search:focus{ border-color: var(--signal); }
  .count{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  .list{ list-style: none; margin: 0; padding: 0; }
  .list li{
    border-bottom: 1px solid var(--line);
  }
  .row{
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    padding: 10px 6px;
    cursor: pointer;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .row:hover{ background: #fafaf8; }
  .swatch{
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    align-self: center;
  }
  .row-eg{
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 45%;
  }

  footer{
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }
  footer a{ color: var(--muted); }

  @media (max-width: 560px){
    header{ padding: 40px 0 24px; }
    .card{ padding: 22px 18px; }
    .row-eg{ display: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="back" href="index.html">← 回作品集</a>
    <h1>曲風抽籤機</h1>
    <p class="lede">
      資料抽取自 <a href="https://everynoise.com/" target="_blank" rel="noopener">Every Noise at Once</a>,
      共 <b id="total">…</b> 個曲風。隨機抽一個,或直接搜尋,每個曲風都能試聽代表曲。
    </p>
  </header>

  <div class="card" id="drawCard">
    <button class="draw-btn" id="drawBtn" disabled>載入中…</button>

    <div class="result" id="result" hidden>
      <h2 class="genre-name" id="genreName"></h2>
      <div class="genre-meta" id="genreMeta"></div>
      <p class="example">代表曲 · <b id="example"></b></p>
      <div class="actions">
        <button class="act primary" id="playBtn">▶ 試聽</button>
        <a class="act" id="spotifyLink" target="_blank" rel="noopener">Spotify 開啟</a>
        <a class="act" id="wikiLink" target="_blank" rel="noopener">維基百科</a>
        <a class="act" id="mapLink" target="_blank" rel="noopener">曲風地圖</a>
      </div>
    </div>
  </div>

  <div class="card">
    <input class="search" id="search" type="search" placeholder="搜尋曲風… 例如 city pop、taiwanese" autocomplete="off">
    <div class="count" id="count"></div>
    <ul class="list" id="list"></ul>
  </div>

  <footer>
    資料為 everynoise.com 的靜態快照 · 試聽音檔來自 Spotify
  </footer>
</div>

<audio id="audio"></audio>

<script>
(() => {
  const NAME = 0, COLOR = 1, TRACK = 2, PREV = 3, EG = 4;
  const LIST_LIMIT = 200;

  const $ = id => document.getElementById(id);
  const audio = $('audio');
  let genres = [];
  let current = null;

  const slug = name => name.toLowerCase().replace(/[^a-z0-9]/g, '');

  function select(g) {
    current = g;
    $('drawCard').style.setProperty('--accent', g[COLOR]);
    $('genreName').textContent = g[NAME];
    $('genreMeta').textContent = `熱門度排名 #${genres.indexOf(g) + 1} / ${genres.length}`;
    $('example').textContent = g[EG];
    $('spotifyLink').href = `https://open.spotify.com/track/${g[TRACK]}`;
    // index.php?search jumps straight to the article when the title matches exactly,
    // and falls back to the results page otherwise, which most genres need.
    $('wikiLink').href = `https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(g[NAME])}`;
    $('mapLink').href = `https://everynoise.com/engenremap-${slug(g[NAME])}.html`;
    $('result').hidden = false;
    play(g);
  }

  function play(g) {
    audio.src = `https://p.scdn.co/mp3-preview/${g[PREV]}`;
    audio.play().catch(() => {});
  }

  function render(query) {
    const q = query.trim().toLowerCase();
    const hits = q ? genres.filter(g => g[NAME].includes(q)) : genres;
    const shown = hits.slice(0, LIST_LIMIT);
    $('count').textContent = hits.length > shown.length
      ? `${hits.length} 個結果,顯示前 ${shown.length} 個`
      : `${hits.length} 個結果`;
    $('list').replaceChildren(...shown.map(g => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'row';
      btn.type = 'button';
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = g[COLOR];
      const name = document.createElement('span');
      name.textContent = g[NAME];
      const eg = document.createElement('span');
      eg.className = 'row-eg';
      eg.textContent = g[EG];
      btn.append(sw, name, eg);
      btn.addEventListener('click', () => {
        select(g);
        $('drawCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      li.append(btn);
      return li;
    }));
  }

  $('drawBtn').addEventListener('click', () => {
    select(genres[Math.floor(Math.random() * genres.length)]);
  });
  $('playBtn').addEventListener('click', () => current && play(current));
  $('search').addEventListener('input', e => render(e.target.value));

  fetch('data/genres.json')
    .then(r => r.json())
    .then(data => {
      genres = data;
      $('total').textContent = data.length;
      $('drawBtn').disabled = false;
      $('drawBtn').textContent = '🎲 抽一個曲風';
      render('');
    })
    .catch(() => {
      $('drawBtn').textContent = '資料載入失敗';
      $('count').textContent = '無法載入曲風資料';
    });
})();
</script>
</body>
</html>
